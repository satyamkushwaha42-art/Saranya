<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Secret Journey | Treasure Hunt</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:italic,wght@0,400;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --romantic-pink: #ffafbd;
            --rose-gold: #e0a96d;
            --deep-red: #8e0e00;
            --soft-white: #fff5f5;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--romantic-pink), #ffc3a0);
            font-family: 'Playfair Display', serif;
            color: var(--deep-red);
            text-align: center;
            overflow: hidden; 
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 2px solid white;
            max-width: 400px;
            width: 90%;
            z-index: 10;
            position: relative;
            transition: all 0.5s ease;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px;
            border: 1px solid var(--rose-gold);
            border-radius: 25px;
            outline: none;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 1.5rem;
            background: var(--soft-white);
            letter-spacing: 2px;
        }

        button {
            background-color: var(--deep-red);
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(142, 14, 0, 0.2);
        }

        button:hover {
            background-color: #b31217;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(142, 14, 0, 0.4);
        }

        /* The Clue Area */
        #result-area {
            margin-top: 2rem;
            display: none;
            animation: fadeIn 1.5s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Heart Animation */
        .heart {
            position: fixed;
            font-size: 1.5rem;
            top: -10%;
            user-select: none;
            z-index: 5;
            animation: fall linear forwards;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .video-btn {
            display: inline-block;
            margin-top: 15px;
            background-color: var(--rose-gold);
            color: white;
            padding: 10px 25px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }

        .video-btn:hover {
            background-color: #c99155;
        }

        .error {
            color: #d9534f;
            font-size: 0.9rem;
            margin-top: 15px;
            min-height: 1.2rem;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <h1>For My Dearest...</h1>
        <p id="instruction-text">Every journey begins with a single secret. Enter the code to reveal your next clue.</p>
        
        <input type="text" id="secretCode" placeholder="Enter Code..." autocomplete="off">
        <br>
        <button id="unlockBtn" onclick="checkCode()">Unlock My Heart</button>

        <div id="result-area">
            <h3>Correct! ❤️</h3>
            <p>I've been waiting for you to find this.</p>
            <a href="https://photos.app.goo.gl/cWwLqj6rS38bJARy7" target="_blank" class="video-btn">✨ Your TREASURE ✨</a>
        </div>
        
        <p id="error-msg" class="error"></p>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            // Randomly pick between different heart colors/shades
            const hearts = ['❤️', '💖', '💕', '💗'];
            heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's'; // Between 3-5 seconds
            heart.style.fontSize = (Math.random() * 10 + 20) + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        function checkCode() {
            const codeInput = document.getElementById('secretCode').value.toUpperCase().trim();
            const resultArea = document.getElementById('result-area');
            const errorMsg = document.getElementById('error-msg');
            const inputField = document.getElementById('secretCode');
            const btn = document.getElementById('unlockBtn');
            const instr = document.getElementById('instruction-text');

            if (codeInput === "7HGB") {
                // Trigger continuous heart rain for a few seconds
                const heartInterval = setInterval(createHeart, 70);
                
                // Visual feedback: hide the form
                inputField.style.display = 'none';
                btn.style.display = 'none';
                instr.style.display = 'none';
                errorMsg.innerText = "";

                // Reveal the link after a slight "suspense" delay
                setTimeout(() => {
                    resultArea.style.display = 'block';
                }, 800);

                // Let the hearts fall for 8 seconds
                setTimeout(() => {
                    clearInterval(heartInterval);
                }, 8000);

            } else {
                errorMsg.innerText = "That's not quite right, my love. Try again!";
                // Temporary shake effect
                const card = document.getElementById('mainCard');
                card.style.borderColor = '#d9534f';
                setTimeout(() => { card.style.borderColor = 'white'; }, 1000);
            }
        }
    </script>
</body>
</html>
